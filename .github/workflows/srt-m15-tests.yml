name: SRT-M15 unit tests

on:
  push:
    paths:
      - "SRT-M15/**"
      - ".github/workflows/srt-m15-tests.yml"
  pull_request:
    paths:
      - "SRT-M15/**"
      - ".github/workflows/srt-m15-tests.yml"

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU PyTorch and optional API test requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r SRT-M15/requirements.txt -r SRT-M15/requirements_api.txt
      - name: Syntax and unit tests
        working-directory: SRT-M15
        run: |
          python -m compileall -q .
          python -m unittest discover -s tests -v
