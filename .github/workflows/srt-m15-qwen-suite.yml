name: SRT-M15 Qwen Full Suite Smoke Checks

on:
  push:
    paths:
      - 'SRT-M15/qwen_teacher_data.py'
      - 'SRT-M15/srt_full_pipeline.py'
      - 'SRT-M15/merge_reviewed_sft.py'
      - 'SRT-M15/evaluate_student_chat.py'
      - 'SRT-M15/review_deepseek_learning.py'
      - 'SRT-M15/srt_m15/ollama_local.py'
      - 'SRT-M15/tests/test_qwen_teacher_data.py'
      - 'SRT-M15/tests/test_srt_full_pipeline.py'
      - 'SRT-M15/tests/test_review_deepseek_learning.py'
      - 'SRT-M15/tests/test_ollama_local.py'
      - '.github/workflows/srt-m15-qwen-suite.yml'
  pull_request:
    paths:
      - 'SRT-M15/**'
      - '.github/workflows/srt-m15-qwen-suite.yml'
  workflow_dispatch:

jobs:
  offline-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: SRT-M15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU PyTorch for offline architecture import
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Compile new source files
        run: |
          python -m py_compile qwen_teacher_data.py srt_full_pipeline.py merge_reviewed_sft.py evaluate_student_chat.py review_deepseek_learning.py srt_m15/ollama_local.py
      - name: Test teacher samples and review integrity
        run: |
          python -m unittest discover -s tests -p "test_qwen_teacher_data.py" -v
          python -m unittest discover -s tests -p "test_review_deepseek_learning.py" -v
          python -m unittest discover -s tests -p "test_srt_full_pipeline.py" -v
          python -m unittest discover -s tests -p "test_ollama_local.py" -v
      - name: Preview generator without network
        run: |
          python srt_full_pipeline.py generate --pairs 10 --offset 0 --preview
